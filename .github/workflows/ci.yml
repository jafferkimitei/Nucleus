name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint-and-typecheck:
    name: Lint, format & typecheck (form-builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=form-builder
      - run: npm run format:check --workspace=form-builder
      - run: npm run typecheck --workspace=form-builder

  unit-tests:
    name: Unit & integration tests (form-builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace=form-builder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: form-builder/coverage/
          retention-days: 7

  build:
    name: Build (form-builder)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=form-builder
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: form-builder/dist/
          retention-days: 7

  e2e:
    name: Playwright E2E (form-builder)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # playwright.config.ts's webServer runs `vite preview`, which serves
      # an already-built dist/ rather than building one itself. Pull down
      # the exact artifact the `build` job already produced instead of
      # rebuilding — without this, dist/ doesn't exist, `vite preview`
      # has nothing to serve, and webServer times out waiting on
      # localhost:4173.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: form-builder/dist
      - run: npx playwright install --with-deps
        working-directory: form-builder
      - run: npm run test:e2e --workspace=form-builder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: form-builder/playwright-report/
          retention-days: 7

# Deployment is handled by Vercel's own GitHub integration (see
# form-builder/vercel.json + the Vercel project's Root Directory setting),
# not by this workflow — Vercel deploys a preview for every PR and
# production on every push to main independently of CI. This workflow is
# the quality gate: pair it with a GitHub branch protection rule on `main`
# requiring these jobs to pass before merge, so nothing unreviewed reaches
# the branch Vercel deploys to production. See the root README.